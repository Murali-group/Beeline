# Tutorial config: runs PEARSON, PPCOR, LEAP, and GRNBOOST2 locally (no Docker)
# against the BoolODE synthetic networks at 500 cells (7 replicates each).
# Requires algorithm-specific conda envs created by utils/setupAnacondaVENV.sh.

input_settings:

    input_dir: "inputs/Synthetic/"

    # All 6 BoolODE synthetic networks x 7 replicates at 500 cells.
    datasets:

        - dataset_id: "dyn-BF/dyn-BF-500"
          nickname: "BF"
          runs:
            - run_id: "dyn-BF-500-1"
            - run_id: "dyn-BF-500-2"
            - run_id: "dyn-BF-500-3"
            - run_id: "dyn-BF-500-4"
            - run_id: "dyn-BF-500-5"
            - run_id: "dyn-BF-500-6"
            - run_id: "dyn-BF-500-7"

        - dataset_id: "dyn-BFC/dyn-BFC-500"
          nickname: "BFC"
          runs:
            - run_id: "dyn-BFC-500-1"
            - run_id: "dyn-BFC-500-2"
            - run_id: "dyn-BFC-500-3"
            - run_id: "dyn-BFC-500-4"
            - run_id: "dyn-BFC-500-5"
            - run_id: "dyn-BFC-500-6"
            - run_id: "dyn-BFC-500-7"

        - dataset_id: "dyn-CY/dyn-CY-500"
          nickname: "CY"
          runs:
            - run_id: "dyn-CY-500-1"
            - run_id: "dyn-CY-500-2"
            - run_id: "dyn-CY-500-3"
            - run_id: "dyn-CY-500-4"
            - run_id: "dyn-CY-500-5"
            - run_id: "dyn-CY-500-6"
            - run_id: "dyn-CY-500-7"

        - dataset_id: "dyn-LI/dyn-LI-500"
          nickname: "LI"
          runs:
            - run_id: "dyn-LI-500-1"
            - run_id: "dyn-LI-500-2"
            - run_id: "dyn-LI-500-3"
            - run_id: "dyn-LI-500-4"
            - run_id: "dyn-LI-500-5"
            - run_id: "dyn-LI-500-6"
            - run_id: "dyn-LI-500-7"

        - dataset_id: "dyn-LL/dyn-LL-500"
          nickname: "LL"
          runs:
            - run_id: "dyn-LL-500-1"
            - run_id: "dyn-LL-500-2"
            - run_id: "dyn-LL-500-3"
            - run_id: "dyn-LL-500-4"
            - run_id: "dyn-LL-500-5"
            - run_id: "dyn-LL-500-6"
            - run_id: "dyn-LL-500-7"

        - dataset_id: "dyn-TF/dyn-TF-500"
          nickname: "TF"
          runs:
            - run_id: "dyn-TF-500-1"
            - run_id: "dyn-TF-500-2"
            - run_id: "dyn-TF-500-3"
            - run_id: "dyn-TF-500-4"
            - run_id: "dyn-TF-500-5"
            - run_id: "dyn-TF-500-6"
            - run_id: "dyn-TF-500-7"

    algorithms:

        - algorithm_id: "PEARSON"
          image: "local"
          should_run: [True]
          params: {}

        - algorithm_id: "PPCOR"
          image: "local"
          should_run: [True]
          params:
              pVal: [0.01]

        - algorithm_id: "LEAP"
          image: "local"
          should_run: [True]
          params:
              # Default maxLag value is 0.3; reduced for large cell counts
              maxLag: [0.10]

        - algorithm_id: "GRNBOOST2"
          image: "local"
          should_run: [True]
          params: {}


output_settings:
    output_dir: "outputs"
    experiment_id: "Tutorial"
