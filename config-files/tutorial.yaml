# Tutorial config: runs PEARSON, PPCOR, LEAP, and GRNBOOST2 locally (no Docker)
# against every BoolODE synthetic network at every cell count.
# Limited to 3 replicates per cell-count group for brevity.
# Requires algorithm-specific conda envs created by utils/setupAnacondaVENV.sh.

input_settings:

    input_dir: "inputs/Synthetic/"

    # All 6 BoolODE synthetic networks x 5 cell counts x 3 replicates.
    datasets:

        - dataset_id: "dyn-BF/dyn-BF-100"
          runs:
            - run_id: "dyn-BF-100-1"
            - run_id: "dyn-BF-100-2"
            - run_id: "dyn-BF-100-3"
